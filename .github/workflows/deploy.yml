name: Deploy API to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "proyecto-devops" ]; then
              git clone https://github.com/mcoradog5-ctrl/proyecto-devops.git
            fi
            cd proyecto-devops
            
            # 1. Forzamos a Git a traer lo limpio de GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # 2. SI FALTA DOCKER COMPOSE EN AWS, SE INSTALA AUTOMÁTICAMENTE
            if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
              echo "Instalando Docker Compose en el servidor de AWS..."
              sudo apt-get update && sudo apt-get install -y docker-compose-plugin
            fi
            
            # 3. Levantamos toda la arquitectura multi-contenedor
            if docker compose version >/dev/null 2>&1; then
              echo "Corriendo con Docker Compose V2"
              docker compose down || true
              docker compose up -d --build
            else
              echo "Corriendo con Docker-Compose V1"
              docker-compose down || true
              docker-compose up -d --build
            fi