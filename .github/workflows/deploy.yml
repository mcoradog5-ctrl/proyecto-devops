name: Deploy API to AWS EC2
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "proyecto-devops" ]; then
              git clone https://github.com/mcoradog5-ctrl/proyecto-devops.git
            fi
            cd proyecto-devops
            git fetch origin main
            git reset --hard origin/main
            if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
              echo "Descargando Docker Compose directamente de GitHub..."
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi
            docker ps --filter "publish=80" -q | xargs -r docker stop || true
            docker ps -a --filter "publish=80" -q | xargs -r docker rm  || true
            if docker compose version >/dev/null 2>&1; then
              echo "Corriendo con Docker Compose V2 (Plugin)"
              docker compose down || true
              docker compose up -d --build
            elif command -v docker-compose >/dev/null 2>&1; then
              echo "Corriendo con Docker Compose V2 (Standalone)"
              docker-compose down || true
              docker-compose up -d --build
            else
              echo "Error crítico: No se pudo instalar Docker Compose."
              exit 1
            fi

    