name: Deploy Proyecto DevOps

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "proyecto-devops" ]; then
              git clone https://github.com/mcoradog5-ctrl/proyecto-devops.git
            fi
            cd proyecto-devops
            
            # 1. Forzamos a Git a traer lo de GitHub limpiando cualquier ganchito local
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Detectamos si tu AWS usa 'docker compose' (nuevo) o 'docker-compose' (viejo)
            if docker compose version >/dev/null 2>&1; then
              echo "Usando Docker Compose V2"
              docker compose down || true
              docker compose up -d --build
            else
              echo "Usando Docker-Compose V1"
              docker-compose down || true
              docker-compose up -d --build
            fi