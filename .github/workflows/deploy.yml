name: Deploy API to AWS EC2
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d "proyecto-devops" ]; then
              git clone https://github.com/mcoradog5-ctrl/proyecto-devops.git
            fi
            cd proyecto-devops
            git fetch origin main
            git reset --hard origin/main

            # Instalar Docker Compose si no existe
            if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
              sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            fi

            # Inicializar Swarm si no está activo
            docker info | grep -q "Swarm: active" || docker swarm init

            # Construir imagen antes del deploy
            docker build -t proyecto-devops-api-service:latest .

            # Bajar contenedores viejos de Docker Compose
            docker compose down --remove-orphans || true
            docker-compose down --remove-orphans || true

            # Limpiar stack de Swarm si existe
            docker stack rm proyecto-devops || true
            sleep 15

            # Forzar desconexión de contenedores de la red
            docker network disconnect -f proyecto-devops_umg-vnet grafana-dashboard || true
            docker network disconnect -f proyecto-devops_umg-vnet database-mongo || true
            docker network disconnect -f proyecto-devops_umg-vnet api-app || true
            docker network disconnect -f proyecto-devops_umg-vnet nginx-lb || true
            sleep 5

            # Eliminar la red
            docker network rm proyecto-devops_umg-vnet || true
            sleep 5

            # Desplegar con Swarm
            docker stack deploy -c docker-compose.yml proyecto-devops
    