version: '3.8'

networks:
  umg-vnet:
    driver: bridge

volumes:
  mongo-db-data:
  grafana-metrics:

services:
  # Balanceador de Carga
  load-balancer:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - umg-vnet
    depends_on:
      - api-service

  # Servidor de Aplicación (Tu API de Node)
  api-service:
    build: .
    container_name: api-app
    restart: always
    environment:
      - MONGO_URI=mongodb://db-service:27017/umgdb
    networks:
      - umg-vnet
    depends_on:
      - db-service

  # Base de Datos
  db-service:
    image: mongo:latest
    container_name: database-mongo
    restart: always
    volumes:
      - mongo-db-data:/data/db
    networks:
      - umg-vnet

  # Monitoreo (Puntos Extra y Requisito)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-dashboard
    ports:
      - "3000:3000"
    volumes:
      - grafana-metrics:/var/lib/grafana
    networks:
      - umg-vnet