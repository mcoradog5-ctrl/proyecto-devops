version: '3.8'

networks:
  umg-vnet:
    driver: overlay

volumes:
  mongo-db-data:
  grafana-metrics:

services:
  # Balanceador de Carga
  load-balancer:
    image: nginx:alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - umg-vnet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # Servidor de Aplicación
  api-service:
    build: .
    image: proyecto-devops-api-service:latest
    environment:
      - MONGO_URI=mongodb://db-service:27017/umgdb
    networks:
      - umg-vnet
    depends_on:
      - db-service
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  # Base de Datos
  db-service:
    image: mongo:latest
    volumes:
      - mongo-db-data:/data/db
    networks:
      - umg-vnet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # Monitoreo
  grafana:
    image: grafana/grafana:latest
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
        mode: host
    volumes:
      - grafana-metrics:/var/lib/grafana
    networks:
      - umg-vnet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure